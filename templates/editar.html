<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Registro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-warning">
            <h3>✏️ Editar Registro</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label>No.</label>
                        <input
                            type="text"
                            class="form-control"
                            name="numero"
                            value="{{ registro[1] }}"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Productor</label>
                        <input
                            type="text"
                            class="form-control"
                            name="productor"
                            value="{{ registro[2] }}"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>No. Comercial</label>
                        <input
                            type="text"
                            class="form-control"
                            name="numero_comercial"
                            value="{{ registro[3] }}"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Finca</label>
                        <input
                            type="text"
                            class="form-control"
                            name="finca"
                            value="{{ registro[4] }}"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Tipo Café</label>
                        <input
                            type="text"
                            class="form-control"
                            name="tipo_cafe"
                            value="{{ registro[5] }}"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Pesado Inicial</label>
                        <input
                            type="number"
                            step="0.01"
                            class="form-control"
                            name="pesado_inicial"
                            value="{{ registro[6] }}"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Pesado Final</label>
                        <input
                            type="     step="0.01"
                            class="form-control"
                            name="pesado_final"
                            value="{{ registro[7] }}"
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Quintales Báscula</label>
                        <input
                            type="number"
                            step="0.01"
                            class="form-control"
                            name="quintales_bascula"
                            value="{{ registro[8] }}"
                        >
                    </div>

                </div>

                <button type="submit" class="btn btn-success">
    💾 Guardar Cambios
</button>

             <a href="/registros" class="btn btn-secondary">
             ↩️ Volver
            </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
