<!DOCTYPE html>
<html>
<head>
    <title>Sistema de Café</title>
</head>
<body>

<h1>Registro de Café</h1>

<form method="POST" enctype="multipart/form-data">

    <p>No.</p>
    <input type="text" name="numero" required>

    <p>Productor</p>
    <input type="text" name="productor" required>

    <p>No. Comercial</p>
    <input type="text" name="numero_comercial">

    <p>Finca</p>
    <input type="text" name="finca">

    <p>Tipo de Café</p>
    <input type="text" name="tipo_cafe">

    <p>Pesado Inicial</p>
    <input type="number" step="0.01" name="pesado_inicial">

    <p>Pesado Final</p>
    <input type="number" step="0.01" name="pesado_final">

    <p>Quintales Báscula</p>
    <input type="number" step="0.01" name="quintales_bascula">

    <p>Imagen</p>
    <input type="file" name="imagen">

    <br><br>

    <button type="submit">
        Guardar Registro
    </button>

</form>

<br><br>

<a href="/registros">
    Ver Registros
</
</html>
