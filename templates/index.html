<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sistema de Café</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-success shadow">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">
            ☕ Sistema de Control de Café
        </span>
    </div>
</nav>

<div class="container mt-4">
    <div class="row mb-4">

    <div class="col-md-4">
        <div class="card bg-primary text-white shadow">
            <div class="card-body">
                <h5>Total Registros</h5>
                <h2>{{ total_registros }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card bg-success text-white shadow">
            <div class="card-body">
                <h5>Total Quintales</h5>
                <h2>{{ total_quintales }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card bg-warning text-dark shadow">
            <div class="card-body">
                <h5>Productores</h5>
                <h2>{{ total_productores }}</h2>
            </div>
        </div>
    </div>

<div class="card mb-4 shadow">

    <div class="card-body text-center">

        <a href="/registros" class="btn btn-primary btn-lg">
            📋 Ver Registros
        </a>

        <a href="/exportar_excel" class="btn btn-success btn-lg">
            📊 Exportar Excel
        </a>

    </div>

</div>

    <div class="card shadow-lg border-0">

        <div class="card-header bg-success text-white">
            <h3 class="mb-0">
                Nuevo Registro
            </h3>
        </div>

        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            No.
                        </label>

                        <input type="text"
                               class="form-control"
                               name="numero"
                               required>
                    </div>

                    <div class="col-md-8 mb-3">
                        <label class="form-label">
                            Productor
                        </label>

                        <input type="text"
                               class="form-control"
                               name="productor"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            No. Comercial
                        </label>

                        <input type="text"
                               class="form-control"
                               name="numero_comercial">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Finca
                        </label>

                        <input type="text"
                               class="form-control"
                               name="finca">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Tipo de Café
                        </label>

                        <input type="text"
                               class="form-control"
                               name="tipo_cafe">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Quintales Báscula
                        </label>

                        <input type="number"
                               step="0.01"
                               class="form-control"
                               name="quintales_bascula">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Pesado Inicial
                        </label>

                        <input type="number"
                               step="0.01"
                               class="form-control"
                               name="pesado_inicial">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Pesado Final
                        </label>

                        <input type="number"
                               step="0.01"
                               class="form-control"
                               name="pesado_final">
                    </div>

                    <div class="col-md-12 mb-4">
                        <label class="form-label">
                            Imagen
                        </label>

                        <input type="file"
                               class="form-control"
                               name="imagen">
                    </div>

                </div>

                <button class="btn btn-success btn-lg">
                    💾 Guardar Registro
                </button>

                <a href="/registros"
                   class="btn btn-primary btn-lg">

                    📋 Ver Registros

                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
