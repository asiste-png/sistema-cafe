<body class="bg-light">

<div class="container mt-4">

    <!-- LOGO Y ENCABEZADO -->
    <div class="card shadow mb-4">

        <div class="card-body text-center">

            <img
                src="{{ url_for('static', filename='logo.jpg') }}"
                alt="Logo Comercial El Mirador"
                class="img-fluid mb-3"
                style="max-height:180px;">

            <h2 class="text-success">
                Sistema de Gestión de Café
            </h2>

            <p class="text-muted">
                Comercial El Mirador, S.A.
            </p>

        </div>

    </div>

    <!-- MENÚ -->
    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <div class="row align-items-center">

                <div class="col-md-5">

                    <form method="GET">

                        <input
                            type="text"
                            class="form-control"
                            name="buscar"
                            placeholder="🔍 Buscar productor, finca o café">

                    </form>

                </div>

                <div class="col-md-7 text-end">

                    <a href="/" class="btn btn-success">
                        ➕ Nuevo Registro
                    </a>

                    <a href="/registros" class="btn btn-secondary">
                        📋 Registros
                    </a>

                    <a href="/usuarios" class="btn btn-info text-white">
                        👥 Usuarios
                    </a>

                    <a href="/exportar_excel" class="btn btn-primary">
                        📊 Excel
                    </a>

                    <a href="/logout" class="btn btn-danger">
                        🚪 Salir
                    </a>

                </div>

            </div>

        </div>

    </div>

    <!-- TARJETAS -->
    <div class="row mb-4">

        <div class="col-md-4">

            <div class="card bg-success text-white shadow">

                <div class="card-body text-center">

                    <h1>📋</h1>

                    <h3>{{ total_registros }}</h3>

                    <p>Total Registros</p>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card bg-primary text-white shadow">

                <div class="card-body text-center">

                    <h1>☕</h1>

                    <h3>{{ total_quintales }}</h3>

                    <p>Total Quintales</p>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card bg-warning text-dark shadow">

                <div class="card-body text-center">

                    <h1>👨‍🌾</h1>

                    <h3>{{ total_productores }}</h3>

                    <p>Productores</p>

                </div>

            </div>

        </div>



            <form method="POST" enctype="multipart/form-data">

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            No.
                        </label>

                        <input type="text"
                               class="form-control"
                               name="numero"
                               required>
                    </div>

                    <div class="col-md-8 mb-3">
                        <label class="form-label">
                            Productor
                        </label>

                        <input type="text"
                               class="form-control"
                               name="productor"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            No. Comercial
                        </label>

                        <input type="text"
                               class="form-control"
                               name="numero_comercial">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Finca
                        </label>

                        <input type="text"
                               class="form-control"
                               name="finca">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Tipo de Café
                        </label>

                        <input type="text"
                               class="form-control"
                               name="tipo_cafe">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Quintales Báscula
                        </label>

                        <input type="number"
                               step="0.01"
                               class="form-control"
                               name="quintales_bascula">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Pesado Inicial
                        </label>

                        <input type="number"
                               step="0.01"
                               class="form-control"
                               name="pesado_inicial">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Pesado Final
                        </label>

                        <input type="number"
                               step="0.01"
                               class="form-control"
                               name="pesado_final">
                    </div>

                    <div class="col-md-12 mb-4">
                        <label class="form-label">
                            Imagen
                        </label>

                        <input type="file"
                               class="form-control"
                               name="imagen">
                    </div>

                </div>

                <button class="btn btn-success btn-lg">
                    💾 Guardar Registro
                </button>

                <a href="/registros"
                   class="btn btn-primary btn-lg">

                    📋 Ver Registros

                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
