<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Editar Usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning">
            <h3>✏️ Editar Usuario</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label>Usuario</label>
                    <input type="text"
                           name="usuario"
                           class="form-control"
                           value="{{ usuario[1] }}">
                </div>

                <div class="mb-3">
                    <label>Contraseña</label>
                    <input type="text"
                           name="password"
                           class="form-control"
                           value="{{ usuario[2] }}">
                </div>

                <div class="mb-3">
                    <label>Rol</label>

                    <select name="rol"
                            class="form-select">

                        <option {% if usuario[3]=='Administrador' %}selected{% endif %}>
                            Administrador
                        </option>

                        <option {% if usuario[3]=='Operador' %}selected{% endif %}>
                            Operador
                        </option>

                        <option {% if usuario[3]=='Consulta' %}selected{% endif %}>
                            Consulta
                        </option>

                    </select>
                </div>

                <div class="mb-3">

                    <label>Estado</label>

                    <select name="estado"
                            class="form-select">

                        <option {% if usuario[4]=='Activo' %}selected{% endif %}>
                            Activo
                        </option>

                        <option {% if usuario[4]=='Inactivo' %}selected{% endif %}>
                            Inactivo
                        </option>

                    </select>

                </div>

                <button type="submit"
                        class="btn btn-success">

                    💾 Guardar

                </button>

                <a href="/usuarios"
                   class="btn btn-secondary">

                    ↩️ Volver

                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
